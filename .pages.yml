# Pages CMS configuration — gives you a form-based editor at https://app.pagescms.org
media:
  input: assets/uploads
  output: /assets/uploads

content:
  - name: posts
    label: Blog posts
    type: collection
    path: _posts
    format: yaml-frontmatter
    filename: "{year}-{month}-{day}-{primary}.md"
    view:
      fields: [title, date]
      primary: title
      sort: [date, title]
      default:
        sort: date
        order: desc
    fields:
      - { name: title, label: Title, type: string, required: true }
      - { name: date, label: Publish date, type: date, required: true }
      - { name: summary, label: Short summary, type: text }
      - { name: tags, label: Tags, type: string, list: true }
      - { name: medium_url, label: Original Medium link, type: string }
      - { name: pdf, label: PDF version (optional), type: file }
      - { name: body, label: Article, type: rich-text }

  - name: profile
    label: About me
    type: file
    path: _data/profile.yml
    format: yaml
    fields:
      - { name: name, label: Name, type: string }
      - { name: headline, label: Headline, type: string }
      - { name: location, label: Location, type: string }
      - { name: intro, label: Self-introduction, type: text }
      - { name: focus, label: Focus areas, type: string, list: true }
      - { name: email, label: Email, type: string }
      - { name: linkedin, label: LinkedIn URL, type: string }
      - { name: github, label: GitHub URL, type: string }
      - { name: medium, label: Medium profile URL, type: string }
      - { name: photo, label: Headshot, type: image }

  - name: projects
    label: Projects
    type: file
    path: _data/projects.yml
    format: yaml
    list: true
    fields:
      - { name: title, label: Title, type: string }
      - { name: context, label: Where / role, type: string }
      - { name: year, label: Year, type: string }
      - { name: result, label: Headline result (e.g. −60% support tickets), type: string }
      - { name: description, label: Description, type: text }
      - { name: tags, label: Tags, type: string, list: true }
      - { name: link, label: Link (optional), type: string }

  - name: education
    label: Education
    type: file
    path: _data/education.yml
    format: yaml
    list: true
    fields:
      - { name: school, label: School, type: string }
      - { name: degree, label: Degree, type: string }
      - { name: year, label: Year, type: string }
      - { name: details, label: Details (GPA, honors), type: string }
