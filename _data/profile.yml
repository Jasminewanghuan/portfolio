name: Jasmine Wang
headline: Product Manager · Data Platforms & Governance
location: New York, NY
intro: |
  I build data products that help financial institutions move faster and trust their data. At ICBC New York, I lead product development for the Data Management Office, where I build the tools that let people across the bank find, understand, and rely on their data. The result is less time spent chasing numbers and more confidence in the decisions and regulatory reports built on them.

  Before that, I took a B2B insurance platform through its Series A at BDIPlus, and earlier interned on TikTok’s e-commerce data team in Beijing. I hold an MS from Columbia University and work fluently in English and Mandarin.
